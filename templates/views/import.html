<div class="panel-card p-6 space-y-4 max-w-xl mx-auto mt-6">
    <div class="flex items-center gap-2">
        <div class="p-2 bg-amber-500/10 rounded-lg">
            <i data-lucide="file-spreadsheets" class="w-5 h-5 text-amber-400"></i>
        </div>
        <h2 class="text-base font-bold text-white tracking-tight">Importar Colección (ManaBox CSV)</h2>
    </div>

    <p class="text-xs text-zinc-400 leading-relaxed">
        Sube el archivo CSV exportado desde tu aplicación ManaBox. Si activas la casilla "Es un mazo", el sistema
        agrupará automáticamente estas cartas en la sección de Mazos.
    </p>

    <form id="upload-form" class="space-y-4 mt-4">
        <div>
            <label class="block text-xs text-zinc-400 mb-1.5 font-medium">Seleccionar CSV</label>
            <input type="file" id="csv-file" accept=".csv" required
                class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-400 hover:file:bg-amber-500/20 border border-zinc-800 rounded-lg cursor-pointer bg-zinc-900 transition">
        </div>

        <div>
            <label class="block text-xs text-zinc-400 mb-1.5 font-medium">Nombre de Ubicación / Mazo</label>
            <input type="text" id="location-input" placeholder="Ej: Bulk General, Mazo Atraxa..." required
                class="w-full px-3 py-2 text-sm bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-200 focus:outline-none focus:border-amber-500/60 transition">
        </div>

        <div class="flex items-center gap-2 p-3 border border-zinc-800 bg-zinc-900/50 rounded-lg">
            <input type="checkbox" id="is-deck-checkbox"
                class="w-4 h-4 rounded bg-zinc-900 border-zinc-700 text-amber-500 focus:ring-amber-500 focus:ring-offset-zinc-900">
            <label for="is-deck-checkbox" class="text-xs font-medium text-zinc-300">
                Agrupar como Mazo Físico (aparecerá en la pestaña Mazos)
            </label>
        </div>

        <button type="submit" id="btn-upload"
            class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
            <i data-lucide="upload" class="w-4 h-4"></i>
            <span>Subir e Importar</span>
        </button>
    </form>

    <div id="upload-status" class="mt-3 text-xs hidden p-3 rounded-lg font-medium text-center"></div>
</div>

<script>
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('upload-status');
        const btn = document.getElementById('btn-upload');
        const formData = new FormData();

        formData.append('file', document.getElementById('csv-file').files[0]);
        formData.append('location', document.getElementById('location-input').value);
        formData.append('is_deck', document.getElementById('is-deck-checkbox').checked);

        statusDiv.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'bg-rose-500/10', 'text-rose-400');
        statusDiv.classList.add('bg-amber-500/10', 'text-amber-400');
        statusDiv.innerHTML = '<div class="flex items-center justify-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Importando registros...</div>';

        btn.disabled = true;
        btn.classList.add('opacity-70');
        if (window.lucide) lucide.createIcons();

        try {
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const result = await res.json();

            statusDiv.classList.remove('bg-amber-500/10', 'text-amber-400');

            if (res.ok) {
                statusDiv.classList.add('bg-emerald-500/10', 'text-emerald-400');
                statusDiv.innerHTML = `<div class="flex items-center justify-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4"></i> ${result.message}</div>`;

                // Actualizar los datos de toda la aplicación globalmente
                if (typeof loadStats === 'function') loadStats();
                if (typeof triggerSearch === 'function') triggerSearch();
                if (typeof loadDecks === 'function') loadDecks();

                document.getElementById('upload-form').reset();
            } else {
                statusDiv.classList.add('bg-rose-500/10', 'text-rose-400');
                statusDiv.innerHTML = `<div class="flex items-center justify-center gap-2"><i data-lucide="alert-circle" class="w-4 h-4"></i> Error: ${result.message}</div>`;
            }
        } catch (err) {
            statusDiv.classList.remove('bg-amber-500/10', 'text-amber-400');
            statusDiv.classList.add('bg-rose-500/10', 'text-rose-400');
            statusDiv.innerHTML = `<div class="flex items-center justify-center gap-2"><i data-lucide="alert-circle" class="w-4 h-4"></i> Error de conexión.</div>`;
        } finally {
            btn.disabled = false;
            btn.classList.remove('opacity-70');
            if (window.lucide) lucide.createIcons();
        }
    });

    // Función global para cargar las estadísticas de la cabecera (index.html)
    async function loadStats() {
        try {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('stat-unique').textContent = data.unique_cards || 0;
            document.getElementById('stat-total').textContent = data.total_cards || 0;
            document.getElementById('stat-locations').textContent = data.total_locations || 0;
        } catch (e) {
            console.error(e);
        }
    }

    // Cargar las estadísticas al inicio
    loadStats();
</script>
