<div class="panel-card p-6 space-y-4 max-w-xl mx-auto mt-6">
    <div class="flex items-center gap-2">
        <div class="p-2 bg-amber-500/10 rounded-lg"><i data-lucide="file-spreadsheets"
                class="w-5 h-5 text-amber-400"></i></div>
        <h2 class="text-base font-bold text-white">Importar Colección CSV</h2>
    </div>
    <form id="upload-form" class="space-y-4 mt-4">
        <div>
            <label class="block text-xs text-zinc-400 mb-1.5 font-medium">Seleccionar CSV</label>
            <input type="file" id="csv-file" accept=".csv" required
                class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-400 hover:file:bg-amber-500/20 border border-zinc-800 rounded-lg cursor-pointer bg-zinc-900 transition">
        </div>
        <div>
            <label class="block text-xs text-zinc-400 mb-1.5 font-medium">Nombre de Ubicación / Mazo</label>
            <input type="text" id="location-input" placeholder="Ej: Bulk General, Mazo Atraxa..." required
                class="w-full px-3 py-2 text-sm bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-200 focus:outline-none focus:border-amber-500/60 transition">
        </div>
        <div class="flex items-center gap-2 p-3 border border-zinc-800 bg-zinc-900/50 rounded-lg">
            <input type="checkbox" id="is-deck-checkbox"
                class="w-4 h-4 rounded bg-zinc-900 border-zinc-700 text-amber-500">
            <label for="is-deck-checkbox" class="text-xs font-medium text-zinc-300">Agrupar automáticamente como Mazo
                Físico</label>
        </div>
        <button type="submit" id="btn-upload"
            class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2 shadow-lg">
            <i data-lucide="upload" class="w-4 h-4"></i> Subir e Importar
        </button>
    </form>
    <div id="upload-status" class="mt-3 text-xs hidden p-3 rounded-lg font-medium text-center"></div>
</div>
