<!-- PANTALLA 1: LISTA GENERAL DE MAZOS -->
<div id="decks-overview" class="space-y-6 block">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-xl font-bold text-white">Gestor de Mazos</h2>
            <p class="text-xs text-zinc-400">Mazos físicos montados y listas teóricas importadas.</p>
        </div>
        <button onclick="document.getElementById('import-text-modal').classList.remove('hidden')"
            class="px-3.5 py-2 bg-amber-500 text-black font-bold text-xs rounded-xl flex items-center gap-2">
            <i data-lucide="clipboard-paste" class="w-4 h-4"></i> Importar Lista
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
            <h3 class="text-sm font-semibold text-amber-400 mb-3 flex items-center gap-2"><i data-lucide="box"
                    class="w-4 h-4"></i> Mazos Físicos (Automáticos)</h3>
            <div id="physical-decks-list" class="space-y-3"></div>
        </div>
        <div>
            <h3 class="text-sm font-semibold text-amber-400 mb-3 flex items-center gap-2"><i data-lucide="file-text"
                    class="w-4 h-4"></i> Listas Teóricas (Brews)</h3>
            <div id="brewed-decks-list" class="space-y-3"></div>
        </div>
    </div>
</div>

<!-- PANTALLA 2: VISTA DETALLADA DEL MAZO -->
<div id="deck-detail-view" class="hidden space-y-4">
    <div class="flex items-center gap-4 border-b border-zinc-800 pb-4">
        <button onclick="closeDeckView()"
            class="p-2 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-xl text-zinc-300 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        <div>
            <h2 id="deck-detail-title" class="text-xl font-bold text-white tracking-tight">Nombre del Mazo</h2>
            <p id="deck-detail-count" class="text-xs text-zinc-400 font-medium">0 cartas</p>
        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-6">
        <!-- Columna Izquierda: Imagen y Precio -->
        <div class="w-full md:w-[260px] flex-shrink-0 space-y-3 sticky top-20 h-fit hidden md:block">
            <div class="rounded-xl overflow-hidden shadow-2xl border border-white/10 relative group">
                <img id="deck-preview-img" src="https://cards.scryfall.io/back.png"
                    class="w-full object-cover aspect-[5/7] transition-all duration-200">
            </div>
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex justify-between items-center shadow-lg">
                <span class="text-xs text-zinc-400 font-semibold uppercase tracking-wider">Valor Total</span>
                <span id="deck-total-price" class="font-extrabold text-amber-400 text-lg">0.00 €</span>
            </div>
        </div>

        <!-- Columna Derecha: Listas -->
        <div id="deck-detail-content" class="flex-1 columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6 text-sm">
        </div>
    </div>
</div>

<!-- MODAL IMPORTAR TEXTO -->
<div id="import-text-modal" class="modal-backdrop hidden z-50">
    <div class="modal-content p-6 max-w-lg w-full relative space-y-4">
        <button onclick="document.getElementById('import-text-modal').classList.add('hidden')"
            class="absolute top-4 right-4 text-zinc-400 hover:text-white"><i data-lucide="x"
                class="w-4 h-4"></i></button>
        <h3 class="text-lg font-bold text-amber-400">Importar Lista Teórica</h3>
        <form id="import-text-form" class="space-y-4 text-xs">
            <input type="text" id="brew-name" placeholder="Nombre de la lista..." required
                class="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-100">
            <textarea id="brew-list" rows="10" placeholder="1 Sol Ring&#10;1 Atraxa..." required
                class="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-100 font-mono text-[10px]"></textarea>
            <button type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2.5 rounded-lg flex items-center justify-center gap-2"
                id="btn-submit-brew">
                <i data-lucide="download" class="w-4 h-4"></i> <span>Importar desde Scryfall</span>
            </button>
        </form>
    </div>
</div>

<!-- MODAL BUSCAR COMANDANTE -->
<div id="commander-search-modal" class="modal-backdrop hidden z-50">
    <div class="modal-content p-6 max-w-lg w-full relative space-y-4 bg-zinc-900 border border-zinc-700">
        <button onclick="document.getElementById('commander-search-modal').classList.add('hidden')"
            class="absolute top-4 right-4 text-zinc-400 hover:text-white"><i data-lucide="x"
                class="w-4 h-4"></i></button>
        <h3 class="text-lg font-bold text-amber-400">Asignar Comandante</h3>
        <p id="commander-search-hint" class="text-xs text-zinc-400"></p>
        <div class="space-y-4">
            <div class="flex gap-2">
                <input type="text" id="commander-search-input" placeholder="Buscar carta por nombre..."
                    class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded-lg text-zinc-100 text-xs focus:border-amber-500 outline-none">
                <button onclick="searchCommanderCard()"
                    class="px-3 py-2 bg-amber-500 text-black font-bold rounded-lg text-xs hover:bg-amber-600 transition"><i
                        data-lucide="search" class="w-4 h-4"></i></button>
            </div>
            <div id="commander-search-results" class="max-h-64 overflow-y-auto space-y-2 custom-scrollbar">
            </div>
        </div>
    </div>
</div>
