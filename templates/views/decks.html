<div class="space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-xl font-bold text-white">Gestor de Mazos</h2>
            <p class="text-xs text-zinc-400">Mazos físicos montados y listas teóricas importadas.</p>
        </div>
        <button onclick="document.getElementById('import-text-modal').classList.remove('hidden')"
            class="px-3.5 py-2 bg-amber-500 text-black font-bold text-xs rounded-xl flex items-center gap-2">
            <i data-lucide="clipboard-paste" class="w-4 h-4"></i> Importar Lista (Moxfield/EDHREC)
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Mazos Físicos -->
        <div>
            <h3 class="text-sm font-semibold text-amber-400 mb-3 flex items-center gap-2"><i data-lucide="box"
                    class="w-4 h-4"></i> Mazos Físicos (Auto)</h3>
            <div id="physical-decks-list" class="space-y-3"></div>
        </div>

        <!-- Listas Teóricas -->
        <div>
            <h3 class="text-sm font-semibold text-amber-400 mb-3 flex items-center gap-2"><i data-lucide="file-text"
                    class="w-4 h-4"></i> Listas Teóricas (Brews)</h3>
            <div id="brewed-decks-list" class="space-y-3"></div>
        </div>
    </div>
</div>

<!-- Modal Importar Texto -->
<div id="import-text-modal" class="modal-backdrop hidden">
    <div class="modal-content p-6 max-w-lg w-full relative space-y-4">
        <button onclick="document.getElementById('import-text-modal').classList.add('hidden')"
            class="absolute top-4 right-4 text-zinc-400 hover:text-white"><i data-lucide="x"
                class="w-4 h-4"></i></button>
        <h3 class="text-lg font-bold text-amber-400">Importar Lista Teórica</h3>

        <form id="import-text-form" class="space-y-4 text-xs">
            <input type="text" id="brew-name" placeholder="Nombre de la lista..." required
                class="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-100">
            <textarea id="brew-list" rows="10" placeholder="1 Sol Ring&#10;1 Atraxa, Praetors' Voice (CM2)" required
                class="w-full px-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-100 font-mono text-[10px]"></textarea>
            <button type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2.5 rounded-lg flex items-center justify-center gap-2"
                id="btn-submit-brew">
                <i data-lucide="download" class="w-4 h-4"></i> <span>Importar desde Scryfall</span>
            </button>
        </form>
    </div>
</div>

<script>
    async function loadDecks() {
        const pRes = await fetch('/api/decks/physical');
        const pData = await pRes.json();
        document.getElementById('physical-decks-list').innerHTML = pData.decks.map(d => `
            <div class="panel-card p-4 flex justify-between items-center border-l-2 border-l-emerald-500">
                <span class="font-bold text-zinc-200">${d.name}</span>
                <span class="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-400">${d.total_cards} cartas</span>
            </div>
        `).join('');

        const bRes = await fetch('/api/decks/brews');
        const bData = await bRes.json();
        document.getElementById('brewed-decks-list').innerHTML = bData.decks.map(d => `
            <div class="panel-card p-4 flex justify-between items-center border-l-2 border-l-amber-500">
                <span class="font-bold text-zinc-200">${d.name}</span>
                <span class="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-400">${d.total_cards} cartas</span>
            </div>
        `).join('');
    }

    document.getElementById('import-text-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit-brew');
        btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Procesando...';

        await fetch('/api/decks/import-text', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('brew-name').value,
                decklist: document.getElementById('brew-list').value
            })
        });

        document.getElementById('import-text-form').reset();
        document.getElementById('import-text-modal').classList.add('hidden');
        btn.innerHTML = '<i data-lucide="download" class="w-4 h-4"></i> Importar desde Scryfall';
        loadDecks();
    });

    loadDecks();
</script>
