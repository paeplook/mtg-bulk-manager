<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Bulk & Collection Manager</title>
    <!-- Tailwind CSS desde CDN para un diseño moderno y rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mtgDark: '#121214',
                        mtgCard: '#1e1e22',
                        mtgAccent: '#f59e0b'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-mtgDark text-gray-200 min-h-screen font-sans">

    <!-- Header / Navbar -->
    <header class="border-b border-gray-800 bg-mtgCard/80 backdrop-blur sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🧙‍♂️</span>
                <h1
                    class="text-2xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
                    MTG Bulk Manager
                </h1>
            </div>

            <!-- Stats Bar -->
            <div id="stats-container"
                class="flex gap-6 text-sm bg-gray-900/60 px-4 py-2 rounded-lg border border-gray-800">
                <div>Cartas Únicas: <span id="stat-unique" class="font-bold text-amber-400">...</span></div>
                <div>Total Cartas: <span id="stat-total" class="font-bold text-amber-400">...</span></div>
                <div>Ubicaciones: <span id="stat-locations" class="font-bold text-amber-400">...</span></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">

        <!-- Columna Izquierda: Importación de CSV -->
        <section class="lg:col-span-1 bg-mtgCard p-6 rounded-2xl border border-gray-800 h-fit">
            <h2 class="text-lg font-semibold text-amber-400 mb-4 flex items-center gap-2">
                <span>📤</span> Importar Colección / Mazo
            </h2>
            <form id="upload-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Archivo CSV de ManaBox</label>
                    <input type="file" id="csv-file" accept=".csv" required
                        class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-400 hover:file:bg-amber-500/20 border border-gray-700 rounded-lg cursor-pointer bg-gray-900">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Nombre de Ubicación / Mazo</label>
                    <input type="text" id="location-input" placeholder="Ej: Bulk General o Deck Atraxa" required
                        class="w-full px-3 py-2 text-sm bg-gray-900 border border-gray-700 rounded-lg text-gray-200 focus:outline-none focus:border-amber-500">
                </div>

                <div class="flex items-center gap-2">
                    <input type="checkbox" id="is-deck-checkbox"
                        class="rounded bg-gray-900 border-gray-700 text-amber-500 focus:ring-0">
                    <label for="is-deck-checkbox" class="text-xs text-gray-300">Es un mazo montado (no bulk)</label>
                </div>

                <button type="submit" id="upload-btn"
                    class="w-full bg-amber-500 hover:bg-amber-600 text-black font-semibold py-2 px-4 rounded-lg text-sm transition-all shadow-lg shadow-amber-500/10">
                    Subir al Servidor
                </button>
            </form>
            <div id="upload-status" class="mt-3 text-xs hidden"></div>
        </section>

        <!-- Columna Derecha: Buscador y Resultados -->
        <section class="lg:col-span-3 space-y-6">

            <!-- Barra de Búsqueda -->
            <div class="relative">
                <input type="text" id="search-input"
                    placeholder="Buscar por nombre de carta (ej: Sol Ring, Counterspell...)"
                    class="w-full px-5 py-4 bg-mtgCard border border-gray-800 rounded-2xl text-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:border-amber-500 transition-all shadow-xl">
                <span class="absolute right-5 top-1/2 -translate-y-1/2 text-xl text-gray-500">🔍</span>
            </div>

            <!-- Grid de Resultados -->
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <!-- Se llena dinámicamente desde JavaScript -->
            </div>

            <div id="no-results" class="hidden text-center py-12 text-gray-500">
                Escribe al menos 2 letras para buscar en tu inventario.
            </div>
        </section>

    </main>

    <script>
        // Cargar estadísticas globales al iniciar
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('stat-unique').textContent = data.unique_cards || 0;
                document.getElementById('stat-total').textContent = data.total_cards || 0;
                document.getElementById('stat-locations').textContent = data.total_locations || 0;
            } catch (e) {
                console.error("Error cargando stats", e);
            }
        }

        // Búsqueda en tiempo real
        const searchInput = document.getElementById('search-input');
        const resultsGrid = document.getElementById('results-grid');
        const noResults = document.getElementById('no-results');

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();

            if (query.length < 2) {
                resultsGrid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            debounceTimer = setTimeout(() => searchCards(query), 300);
        });

        async function searchCards(query) {
            noResults.classList.add('hidden');
            resultsGrid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-400">Buscando...</div>';

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    resultsGrid.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">No se encontraron cartas con ese nombre.</div>';
                    return;
                }

                // Agrupar resultados por Nombre de Carta
                const grouped = {};
                data.results.forEach(item => {
                    if (!grouped[item.name]) grouped[item.name] = [];
                    grouped[item.name].push(item);
                });

                resultsGrid.innerHTML = '';

                Object.keys(grouped).forEach(cardName => {
                    const locations = grouped[cardName];
                    const firstMatch = locations[0];
                    const imageUrl = `https://api.scryfall.com/cards/${firstMatch.scryfall_id}?format=image`;

                    const cardHtml = `
                        <div class="bg-mtgCard border border-gray-800 rounded-2xl p-4 flex flex-col justify-between hover:border-amber-500/40 transition-all shadow-lg group">
                            <div>
                                <!-- Imagen de Scryfall -->
                                <div class="relative mb-3 overflow-hidden rounded-xl bg-gray-900 aspect-[5/7]">
                                    <img src="${imageUrl}" alt="${cardName}" loading="lazy"
                                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                        onerror="this.onerror=null; this.src='https://cards.scryfall.io/back.png';">
                                </div>

                                <h3 class="font-bold text-base text-gray-100 mb-1">${cardName}</h3>
                                <p class="text-xs text-gray-400 mb-3">${firstMatch.set_name} (${firstMatch.set_code.toUpperCase()})</p>
                            </div>

                            <!-- Desglose de Ubicaciones -->
                            <div class="space-y-2 border-t border-gray-800/80 pt-3 text-xs">
                                ${locations.map(loc => `
                                    <div class="flex justify-between items-center py-1 px-2 rounded-md ${loc.is_deck ? 'bg-amber-500/10 text-amber-300' : 'bg-emerald-500/10 text-emerald-300'}">
                                        <span class="font-medium">${loc.is_deck ? '⚔️ ' : '📦 '}${loc.location}</span>
                                        <span class="font-bold text-sm px-2 py-0.5 rounded bg-black/40">${loc.total_quantity}x</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    resultsGrid.innerHTML += cardHtml;
                });

            } catch (e) {
                resultsGrid.innerHTML = '<div class="col-span-full text-center py-8 text-red-400">Error al consultar la base de datos.</div>';
            }
        }

        // Subida de CSV
        const uploadForm = document.getElementById('upload-form');
        const uploadStatus = document.getElementById('upload-status');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('csv-file');
            const locationInput = document.getElementById('location-input');
            const isDeckInput = document.getElementById('is-deck-checkbox');

            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('location', locationInput.value.trim());
            formData.append('is_deck', isDeckInput.checked);

            uploadStatus.className = 'mt-3 text-xs text-amber-400';
            uploadStatus.textContent = '⏳ Procesando e insertando en PostgreSQL...';
            uploadStatus.classList.remove('hidden');

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                if (result.status === 'success') {
                    uploadStatus.className = 'mt-3 text-xs text-emerald-400';
                    uploadStatus.textContent = `✅ ${result.message}`;
                    uploadForm.reset();
                    loadStats();
                } else {
                    uploadStatus.className = 'mt-3 text-xs text-red-400';
                    uploadStatus.textContent = `❌ Error: ${result.message}`;
                }
            } catch (e) {
                uploadStatus.className = 'mt-3 text-xs text-red-400';
                uploadStatus.textContent = '❌ Error de conexión al subir.';
            }
        });

        // Inicializar al cargar la página
        loadStats();
    </script>
</body>

</html>
