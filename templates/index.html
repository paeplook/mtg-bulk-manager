<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Collection Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mtgDark: '#0f0f12',
                        mtgCard: '#18181c',
                        mtgHeader: '#121216',
                        wMana: '#f8f6d8',
                        uMana: '#c1d7e9',
                        bMana: '#bab1ab',
                        rMana: '#e49977',
                        gMana: '#a3c095'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-mtgDark text-gray-200 min-h-screen font-sans">

    <!-- Navegación Superior -->
    <header class="bg-mtgHeader border-b border-gray-800 sticky top-0 z-50 px-6 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">

            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-3">
                    <span class="text-3xl">🧙‍♂️</span>
                    <h1
                        class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
                        MTG Manager
                    </h1>
                </div>

                <!-- Menú de Pestañas / Secciones -->
                <nav class="flex space-x-1 bg-gray-900/80 p-1 rounded-xl border border-gray-800 text-sm">
                    <button onclick="switchTab('search-tab')" id="nav-search-tab"
                        class="tab-btn px-4 py-1.5 rounded-lg font-medium text-amber-400 bg-mtgCard transition">
                        🔍 Buscador
                    </button>
                    <button onclick="switchTab('import-tab')" id="nav-import-tab"
                        class="tab-btn px-4 py-1.5 rounded-lg font-medium text-gray-400 hover:text-white transition">
                        📤 Importar CSV
                    </button>
                </nav>
            </div>

            <!-- Stats Rápidas -->
            <div class="flex gap-4 text-xs bg-gray-900/60 px-4 py-2 rounded-xl border border-gray-800">
                <div>Únicas: <span id="stat-unique" class="font-bold text-amber-400">...</span></div>
                <div>Total: <span id="stat-total" class="font-bold text-amber-400">...</span></div>
                <div>Ubicaciones: <span id="stat-locations" class="font-bold text-amber-400">...</span></div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-6">

        <!-- PESTAÑA 1: BUSCADOR CON FILTROS -->
        <section id="search-tab" class="tab-content space-y-6">

            <!-- Panel de Búsqueda y Filtros -->
            <div class="bg-mtgCard border border-gray-800 rounded-2xl p-5 space-y-4 shadow-xl">

                <!-- Buscador Principal -->
                <div class="relative">
                    <input type="text" id="search-input"
                        placeholder="Buscar carta por nombre (ej: Sol Ring, Counterspell...)"
                        class="w-full px-5 py-3.5 bg-gray-900 border border-gray-700 rounded-xl text-gray-100 placeholder-gray-500 focus:outline-none focus:border-amber-500 transition">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                </div>

                <!-- Filtros Secundarios -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-gray-800 pt-4">

                    <!-- Filtro por Rareza -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">Rareza</label>
                        <div class="flex flex-wrap gap-2 text-xs">
                            <button onclick="toggleRarity('common')" id="rarity-common"
                                class="rarity-btn px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-900 text-gray-300">Común</button>
                            <button onclick="toggleRarity('uncommon')" id="rarity-uncommon"
                                class="rarity-btn px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-900 text-gray-300">Infrecuente</button>
                            <button onclick="toggleRarity('rare')" id="rarity-rare"
                                class="rarity-btn px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-900 text-amber-400/80">Rara</button>
                            <button onclick="toggleRarity('mythic')" id="rarity-mythic"
                                class="rarity-btn px-3 py-1.5 rounded-lg border border-gray-700 bg-gray-900 text-orange-400/80">Mítica</button>
                        </div>
                    </div>

                    <!-- Filtro por Colores (WUBRG) -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">Colores</label>
                        <div class="flex gap-2">
                            <button onclick="toggleColor('W')" id="color-W"
                                class="color-btn w-8 h-8 rounded-full border border-gray-700 bg-gray-800 text-wMana font-bold text-xs flex items-center justify-center transition">☀️</button>
                            <button onclick="toggleColor('U')" id="color-U"
                                class="color-btn w-8 h-8 rounded-full border border-gray-700 bg-gray-800 text-uMana font-bold text-xs flex items-center justify-center transition">💧</button>
                            <button onclick="toggleColor('B')" id="color-B"
                                class="color-btn w-8 h-8 rounded-full border border-gray-700 bg-gray-800 text-bMana font-bold text-xs flex items-center justify-center transition">💀</button>
                            <button onclick="toggleColor('R')" id="color-R"
                                class="color-btn w-8 h-8 rounded-full border border-gray-700 bg-gray-800 text-rMana font-bold text-xs flex items-center justify-center transition">🔥</button>
                            <button onclick="toggleColor('G')" id="color-G"
                                class="color-btn w-8 h-8 rounded-full border border-gray-700 bg-gray-800 text-gMana font-bold text-xs flex items-center justify-center transition">🌲</button>
                            <button onclick="toggleColor('C')" id="color-C"
                                class="color-btn w-8 h-8 rounded-full border border-gray-700 bg-gray-800 text-gray-400 font-bold text-xs flex items-center justify-center transition">💎</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Resultados -->
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Se rellena vía JavaScript -->
            </div>
            <div id="no-results" class="text-center py-12 text-gray-500">
                Escribe en el buscador para ver las cartas coincidentes.
            </div>
        </section>

        <!-- PESTAÑA 2: IMPORTAR CSV -->
        <section id="import-tab" class="tab-content hidden max-w-xl mx-auto">
            <div class="bg-mtgCard p-6 rounded-2xl border border-gray-800 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-amber-400">📤 Importar Archivo CSV de ManaBox</h2>

                <form id="upload-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Seleccionar CSV</label>
                        <input type="file" id="csv-file" accept=".csv" required
                            class="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-400 hover:file:bg-amber-500/20 border border-gray-700 rounded-lg cursor-pointer bg-gray-900">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Nombre de Ubicación / Mazo</label>
                        <input type="text" id="location-input" placeholder="Ej: Bulk General, Mazo Atraxa..." required
                            class="w-full px-3 py-2 text-sm bg-gray-900 border border-gray-700 rounded-lg text-gray-200 focus:outline-none focus:border-amber-500">
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="is-deck-checkbox"
                            class="rounded bg-gray-900 border-gray-700 text-amber-500">
                        <label for="is-deck-checkbox" class="text-xs text-gray-300">Es un mazo montado (no bulk
                            general)</label>
                    </div>

                    <button type="submit"
                        class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2.5 rounded-lg text-sm transition">
                        Subir al Servidor
                    </button>
                </form>
                <div id="upload-status" class="mt-3 text-xs hidden"></div>
            </div>
        </section>

    </main>

    <script>
        let activeRarities = [];
        let activeColors = [];
        let cardCache = [];

        // Cambio de Pestañas
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-amber-400', 'bg-mtgCard');
                el.classList.add('text-gray-400');
            });

            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('text-amber-400', 'bg-mtgCard');
            document.getElementById(`nav-${tabId}`).classList.remove('text-gray-400');
        }

        // Toggle Rareza
        function toggleRarity(rarity) {
            const btn = document.getElementById(`rarity-${rarity}`);
            if (activeRarities.includes(rarity)) {
                activeRarities = activeRarities.filter(r => r !== rarity);
                btn.classList.remove('bg-amber-500/20', 'border-amber-500');
                btn.classList.add('bg-gray-900', 'border-gray-700');
            } else {
                activeRarities.push(rarity);
                btn.classList.add('bg-amber-500/20', 'border-amber-500');
                btn.classList.remove('bg-gray-900', 'border-gray-700');
            }
            triggerSearch();
        }

        // Toggle Color
        function toggleColor(color) {
            const btn = document.getElementById(`color-${color}`);
            if (activeColors.includes(color)) {
                activeColors = activeColors.filter(c => c !== color);
                btn.classList.remove('ring-2', 'ring-amber-400', 'scale-110');
            } else {
                activeColors.push(color);
                btn.classList.add('ring-2', 'ring-amber-400', 'scale-110');
            }
            filterCurrentResults();
        }

        const searchInput = document.getElementById('search-input');
        let debounceTimer;

        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(triggerSearch, 300);
        });

        async function triggerSearch() {
            const query = searchInput.value.trim();
            if (query.length < 2) {
                document.getElementById('results-grid').innerHTML = '';
                document.getElementById('no-results').classList.remove('hidden');
                return;
            }

            let url = `/api/search?q=${encodeURIComponent(query)}`;
            if (activeRarities.length > 0) {
                url += `&rarity=${activeRarities.join(',')}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                cardCache = data.results || [];
                filterCurrentResults();
            } catch (e) {
                console.error("Error buscando cartas", e);
            }
        }

        function filterCurrentResults() {
            const grid = document.getElementById('results-grid');
            const noResults = document.getElementById('no-results');

            if (cardCache.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            // Grouping by Card Name
            const grouped = {};
            cardCache.forEach(item => {
                if (!grouped[item.name]) grouped[item.name] = [];
                grouped[item.name].push(item);
            });

            grid.innerHTML = '';

            Object.keys(grouped).forEach(cardName => {
                const locations = grouped[cardName];
                const card = locations[0];
                const imageUrl = `https://api.scryfall.com/cards/${card.scryfall_id}?format=image`;

                const cardHtml = `
                    <div class="bg-mtgCard border border-gray-800 rounded-2xl p-4 flex flex-col justify-between hover:border-amber-500/40 transition shadow-lg">
                        <div>
                            <div class="relative mb-3 overflow-hidden rounded-xl bg-gray-900 aspect-[5/7]">
                                <img src="${imageUrl}" alt="${cardName}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition duration-300" onerror="this.src='https://cards.scryfall.io/back.png';">
                            </div>
                            <h3 class="font-bold text-sm text-gray-100 mb-0.5">${cardName}</h3>
                            <p class="text-xs text-gray-400 mb-3">${card.set_name} (${card.set_code.toUpperCase()})</p>
                        </div>

                        <div class="space-y-1.5 border-t border-gray-800 pt-2 text-xs">
                            ${locations.map(loc => `
                                <div class="flex justify-between items-center py-1 px-2 rounded ${loc.is_deck ? 'bg-amber-500/10 text-amber-300' : 'bg-emerald-500/10 text-emerald-300'}">
                                    <span class="truncate">${loc.is_deck ? '⚔️ ' : '📦 '}${loc.location}</span>
                                    <span class="font-bold ml-2">${loc.total_quantity}x</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('stat-unique').textContent = data.unique_cards || 0;
                document.getElementById('stat-total').textContent = data.total_cards || 0;
                document.getElementById('stat-locations').textContent = data.total_locations || 0;
            } catch (e) { }
        }

        loadStats();
    </script>
</body>

</html>
