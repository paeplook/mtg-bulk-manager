<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Collection Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mana CSS (Símbolos Oficiales de MTG) -->
    <link href="https://cdn.jsdelivr.net/npm/mana-font@1.4.1/css/mana.min.css" rel="stylesheet" type="text/css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mtgDark: '#0b0b0e',
                        mtgCard: '#121216',
                        mtgHeader: '#16161c'
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #121216;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-mtgDark text-gray-200 min-h-screen font-sans">

    <!-- Navegación Superior -->
    <header class="bg-mtgHeader border-b border-gray-800/80 sticky top-0 z-40 px-6 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">

            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-3">
                    <span class="text-3xl">🧙‍♂️</span>
                    <h1
                        class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
                        MTG Manager
                    </h1>
                </div>

                <nav class="flex space-x-1 bg-gray-900/80 p-1 rounded-xl border border-gray-800 text-sm">
                    <button onclick="switchTab('search-tab')" id="nav-search-tab"
                        class="tab-btn px-4 py-1.5 rounded-lg font-medium text-amber-400 bg-mtgCard transition">
                        🔍 Colección
                    </button>
                    <button onclick="switchTab('import-tab')" id="nav-import-tab"
                        class="tab-btn px-4 py-1.5 rounded-lg font-medium text-gray-400 hover:text-white transition">
                        📤 Importar CSV
                    </button>
                </nav>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="updatePricesNow()" id="btn-update-prices"
                    class="text-xs px-3 py-1.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 transition flex items-center gap-1 font-semibold">
                    🔄 Sincronizar Cardmarket
                </button>

                <div class="flex gap-4 text-xs bg-gray-900/60 px-4 py-2 rounded-xl border border-gray-800">
                    <div>Únicas: <span id="stat-unique" class="font-bold text-amber-400">...</span></div>
                    <div>Total: <span id="stat-total" class="font-bold text-amber-400">...</span></div>
                    <div>Ubicaciones: <span id="stat-locations" class="font-bold text-amber-400">...</span></div>
                </div>
            </div>

        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- PESTAÑA 1: COLECCIÓN -->
        <section id="search-tab" class="tab-content space-y-6">

            <div class="bg-mtgCard border border-gray-800/80 rounded-2xl p-4 space-y-4 shadow-xl">

                <div class="flex flex-col md:flex-row gap-3">
                    <div class="relative flex-1">
                        <input type="text" id="search-input" placeholder="Buscar carta por nombre..."
                            class="w-full px-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-amber-500 transition">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                    </div>

                    <div class="relative min-w-[200px]">
                        <select id="sort-select" onchange="triggerSearch()"
                            class="w-full px-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-xs text-amber-400 font-semibold focus:outline-none focus:border-amber-500 cursor-pointer appearance-none">
                            <option value="name_asc">🔤 Nombre (A - Z)</option>
                            <option value="name_desc">🔤 Nombre (Z - A)</option>
                            <option value="price_desc">💲 Precio (Mayor a Menor)</option>
                            <option value="price_asc">💲 Precio (Menor a Mayor)</option>
                            <option value="cmc_asc">🔮 Coste Maná (Menor a Mayor)</option>
                            <option value="cmc_desc">🔮 Coste Maná (Mayor a Menor)</option>
                        </select>
                        <span
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs">▼</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-gray-800/80 pt-3">

                    <div>
                        <label class="block text-[11px] font-semibold text-gray-400 mb-1.5">Rareza</label>
                        <div class="flex flex-wrap gap-1.5 text-xs">
                            <button onclick="toggleRarity('common')" id="rarity-common"
                                class="rarity-btn px-2.5 py-1 rounded-md border border-gray-800 bg-gray-900 text-gray-300">Común</button>
                            <button onclick="toggleRarity('uncommon')" id="rarity-uncommon"
                                class="rarity-btn px-2.5 py-1 rounded-md border border-gray-800 bg-gray-900 text-gray-300">Infrecuente</button>
                            <button onclick="toggleRarity('rare')" id="rarity-rare"
                                class="rarity-btn px-2.5 py-1 rounded-md border border-gray-800 bg-gray-900 text-amber-400/80">Rara</button>
                            <button onclick="toggleRarity('mythic')" id="rarity-mythic"
                                class="rarity-btn px-2.5 py-1 rounded-md border border-gray-800 bg-gray-900 text-orange-400/80">Mítica</button>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-[11px] font-semibold text-gray-400">Colores</label>
                            <button onclick="toggleCommanderMode()" id="commander-toggle"
                                class="text-[11px] px-2 py-0.5 rounded-md border border-gray-800 bg-gray-900 text-gray-400 hover:text-white transition flex items-center gap-1">
                                <span id="commander-dot" class="w-1.5 h-1.5 rounded-full bg-gray-600"></span>
                                Commander Identity
                            </button>
                        </div>

                        <div class="flex gap-1.5 text-lg">
                            <button onclick="toggleColor('W')" id="color-W"
                                class="color-btn p-0.5 rounded-full border border-transparent opacity-60 hover:opacity-100 transition"><i
                                    class="ms ms-w ms-cost shadow"></i></button>
                            <button onclick="toggleColor('U')" id="color-U"
                                class="color-btn p-0.5 rounded-full border border-transparent opacity-60 hover:opacity-100 transition"><i
                                    class="ms ms-u ms-cost shadow"></i></button>
                            <button onclick="toggleColor('B')" id="color-B"
                                class="color-btn p-0.5 rounded-full border border-transparent opacity-60 hover:opacity-100 transition"><i
                                    class="ms ms-b ms-cost shadow"></i></button>
                            <button onclick="toggleColor('R')" id="color-R"
                                class="color-btn p-0.5 rounded-full border border-transparent opacity-60 hover:opacity-100 transition"><i
                                    class="ms ms-r ms-cost shadow"></i></button>
                            <button onclick="toggleColor('G')" id="color-G"
                                class="color-btn p-0.5 rounded-full border border-transparent opacity-60 hover:opacity-100 transition"><i
                                    class="ms ms-g ms-cost shadow"></i></button>
                            <button onclick="toggleColor('C')" id="color-C"
                                class="color-btn p-0.5 rounded-full border border-transparent opacity-60 hover:opacity-100 transition"><i
                                    class="ms ms-c ms-cost shadow"></i></button>
                        </div>
                    </div>

                </div>
            </div>

            <div id="loading-spinner" class="hidden text-center py-8 text-amber-400 text-sm">
                <span class="animate-spin inline-block mr-2">⏳</span> Cargando colección...
            </div>

            <!-- PARRILLA DE CARTAS COMPACTA -->
            <div id="results-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <!-- Se llena con JS -->
            </div>
            <div id="no-results" class="text-center py-12 text-gray-500 hidden text-sm">
                No hay cartas que coincidan con los filtros.
            </div>
        </section>

        <!-- PESTAÑA 2: IMPORTAR CSV -->
        <section id="import-tab" class="tab-content hidden max-w-xl mx-auto">
            <div class="bg-mtgCard p-6 rounded-2xl border border-gray-800 shadow-xl space-y-4">
                <h2 class="text-lg font-bold text-amber-400">📤 Importar Archivo CSV de ManaBox</h2>
                <form id="upload-form" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Seleccionar CSV</label>
                        <input type="file" id="csv-file" accept=".csv" required
                            class="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500/10 file:text-amber-400 hover:file:bg-amber-500/20 border border-gray-700 rounded-lg cursor-pointer bg-gray-900">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Nombre de Ubicación / Mazo</label>
                        <input type="text" id="location-input" placeholder="Ej: Bulk General, Mazo Atraxa..." required
                            class="w-full px-3 py-2 text-sm bg-gray-900 border border-gray-700 rounded-lg text-gray-200 focus:outline-none focus:border-amber-500">
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="is-deck-checkbox"
                            class="rounded bg-gray-900 border-gray-700 text-amber-500">
                        <label for="is-deck-checkbox" class="text-xs text-gray-300">Es un mazo montado (no bulk
                            general)</label>
                    </div>
                    <button type="submit"
                        class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2.5 rounded-lg text-sm transition">
                        Subir al Servidor
                    </button>
                </form>
                <div id="upload-status" class="mt-3 text-xs hidden"></div>
            </div>
        </section>

    </main>

    <!-- MODAL VENTANA FLOTANTE DETALLE DE CARTA -->
    <div id="card-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div
            class="bg-mtgCard border border-gray-800 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col md:flex-row relative">

            <button onclick="closeCardModal()"
                class="absolute top-3 right-3 text-gray-400 hover:text-white bg-gray-900/80 p-2 rounded-full z-10">
                ✕
            </button>

            <!-- Lado Izquierdo: Imagen -->
            <div class="p-6 md:w-1/2 flex items-center justify-center bg-gray-950/50">
                <img id="modal-card-img" src=""
                    class="w-full max-w-[280px] rounded-xl shadow-2xl object-cover aspect-[5/7]">
            </div>

            <!-- Lado Derecho: Detalles -->
            <div class="p-6 md:w-1/2 flex flex-col justify-between overflow-y-auto custom-scrollbar space-y-4">
                <div>
                    <div class="flex items-start justify-between gap-2 mb-1">
                        <h2 id="modal-card-title" class="text-xl font-bold text-gray-100"></h2>
                    </div>
                    <p id="modal-card-translated-name" class="text-sm text-amber-400 italic mb-2"></p>

                    <div
                        class="flex items-center gap-2 text-xs text-gray-400 mb-4 bg-gray-900/80 p-2 rounded-lg border border-gray-800">
                        <i id="modal-set-icon" class="ms text-base"></i>
                        <span id="modal-set-info"></span>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Efecto / Texto
                            (Español)</h4>
                        <div id="modal-card-text"
                            class="text-xs bg-gray-900/60 p-3 rounded-xl text-gray-200 border border-gray-800 leading-relaxed space-y-1">
                            Cargando traducción oficial...
                        </div>
                    </div>
                </div>

                <div class="space-y-3 pt-3 border-t border-gray-800">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-gray-400">Precio estimado Cardmarket:</span>
                        <span id="modal-card-price" class="font-bold text-amber-400 text-sm"></span>
                    </div>

                    <div>
                        <span class="text-xs text-gray-400 block mb-1">Ubicación / Inventario:</span>
                        <div id="modal-card-locations" class="space-y-1 text-xs"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let activeRarities = [];
        let activeColors = [];
        let isCommanderMode = false;
        let cardCache = [];

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-amber-400', 'bg-mtgCard');
                el.classList.add('text-gray-400');
            });

            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('text-amber-400', 'bg-mtgCard');
            document.getElementById(`nav-${tabId}`).classList.remove('text-gray-400');
        }

        async function updatePricesNow() {
            const btn = document.getElementById('btn-update-prices');
            btn.innerHTML = '⏳ Sincronizando...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/update-prices', { method: 'POST' });
                alert("Sincronización de precios iniciada.");
            } catch (e) {
                alert("Error al iniciar actualización.");
            } finally {
                btn.innerHTML = '🔄 Sincronizar Cardmarket';
                btn.disabled = false;
            }
        }

        function toggleCommanderMode() {
            isCommanderMode = !isCommanderMode;
            const btn = document.getElementById('commander-toggle');
            const dot = document.getElementById('commander-dot');

            if (isCommanderMode) {
                btn.classList.add('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
                btn.classList.remove('border-gray-800', 'bg-gray-900', 'text-gray-400');
                dot.classList.add('bg-amber-400');
            } else {
                btn.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
                btn.classList.add('border-gray-800', 'bg-gray-900', 'text-gray-400');
                dot.classList.remove('bg-amber-400');
            }

            filterCurrentResults();
        }

        function toggleRarity(rarity) {
            const btn = document.getElementById(`rarity-${rarity}`);
            if (activeRarities.includes(rarity)) {
                activeRarities = activeRarities.filter(r => r !== rarity);
                btn.classList.remove('bg-amber-500/20', 'border-amber-500');
                btn.classList.add('bg-gray-900', 'border-gray-800');
            } else {
                activeRarities.push(rarity);
                btn.classList.add('bg-amber-500/20', 'border-amber-500');
                btn.classList.remove('bg-gray-900', 'border-gray-800');
            }
            triggerSearch();
        }

        function toggleColor(color) {
            const btn = document.getElementById(`color-${color}`);
            if (activeColors.includes(color)) {
                activeColors = activeColors.filter(c => c !== color);
                btn.classList.remove('border-amber-400', 'ring-2', 'ring-amber-400/50', 'opacity-100');
                btn.classList.add('border-transparent', 'opacity-60');
            } else {
                activeColors.push(color);
                btn.classList.add('border-amber-400', 'ring-2', 'ring-amber-400/50', 'opacity-100');
                btn.classList.remove('border-transparent', 'opacity-60');
            }
            filterCurrentResults();
        }

        const searchInput = document.getElementById('search-input');
        let debounceTimer;

        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(triggerSearch, 300);
        });

        async function triggerSearch() {
            const query = searchInput.value.trim();
            const sortBy = document.getElementById('sort-select').value;
            const spinner = document.getElementById('loading-spinner');

            spinner.classList.remove('hidden');

            let url = `/api/search?q=${encodeURIComponent(query)}&sort_by=${sortBy}`;
            if (activeRarities.length > 0) {
                url += `&rarity=${activeRarities.join(',')}`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                cardCache = data.results || [];

                await fetchCardColorsAndCMC();

                if (sortBy === 'cmc_asc') {
                    cardCache.sort((a, b) => (a.cmc || 0) - (b.cmc || 0));
                } else if (sortBy === 'cmc_desc') {
                    cardCache.sort((a, b) => (b.cmc || 0) - (a.cmc || 0));
                }

                filterCurrentResults();
            } catch (e) {
                console.error("Error buscando cartas", e);
            } finally {
                spinner.classList.add('hidden');
            }
        }

        async function fetchCardColorsAndCMC() {
            const uniqueIds = [...new Set(cardCache.map(c => c.scryfall_id))];
            if (uniqueIds.length === 0) return;

            const promises = uniqueIds.map(id =>
                fetch(`https://api.scryfall.com/cards/${id}`)
                    .then(r => r.json())
                    .catch(() => null)
            );

            const scryfallData = await Promise.all(promises);
            const colorMap = {};
            const cmcMap = {};

            scryfallData.forEach(card => {
                if (card && card.id) {
                    colorMap[card.id] = card.color_identity || card.colors || [];
                    cmcMap[card.id] = card.cmc || 0;
                }
            });

            cardCache.forEach(card => {
                card.colors = colorMap[card.scryfall_id] || [];
                card.cmc = cmcMap[card.scryfall_id] || 0;
            });
        }

        function filterCurrentResults() {
            const grid = document.getElementById('results-grid');
            const noResults = document.getElementById('no-results');

            if (cardCache.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            let filteredCards = cardCache;

            if (activeColors.length > 0) {
                filteredCards = cardCache.filter(card => {
                    const cardColors = card.colors || [];
                    const isColorlessCard = (cardColors.length === 0);

                    if (isCommanderMode) {
                        if (isColorlessCard) return activeColors.includes('C');
                        return cardColors.every(cardColor => activeColors.includes(cardColor));
                    }

                    if (isColorlessCard) return activeColors.includes('C');

                    const coloredSelections = activeColors.filter(c => c !== 'C');
                    if (coloredSelections.length === 0) return false;

                    return coloredSelections.some(selectedColor => cardColors.includes(selectedColor));
                });
            }

            if (filteredCards.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            const grouped = {};
            filteredCards.forEach(item => {
                if (!grouped[item.name]) grouped[item.name] = [];
                grouped[item.name].push(item);
            });

            grid.innerHTML = '';

            Object.keys(grouped).forEach(cardName => {
                const locations = grouped[cardName];
                const card = locations[0];
                const imageUrl = `https://api.scryfall.com/cards/${card.scryfall_id}?format=image`;
                const priceFormatted = card.purchase_price ? `${card.purchase_price}€` : '-';
                const totalQty = locations.reduce((acc, l) => acc + (l.total_quantity || 1), 0);

                // Formato del código de edición + número (#258)
                const collectorNum = card.collector_number ? `#${card.collector_number}` : '';

                const cardHtml = `
                    <div onclick="openCardModal('${card.scryfall_id}', '${encodeURIComponent(JSON.stringify(locations))}')" 
                        class="bg-mtgCard border border-gray-800/80 hover:border-amber-500/60 rounded-xl p-1 flex flex-col justify-between cursor-pointer transition shadow-md hover:scale-[1.02] group">
                        
                        <div class="relative overflow-hidden rounded-lg bg-gray-900 aspect-[5/7]">
                            <img src="${imageUrl}" alt="${cardName}" loading="lazy" class="w-full h-full object-cover rounded-lg">
                            
                            <span class="absolute bottom-1 left-1 bg-black/80 text-white font-bold text-[11px] px-1.5 py-0.2 rounded-md border border-white/10">
                                ${totalQty}
                            </span>

                            <span class="absolute bottom-1 right-1 bg-black/80 text-amber-400 font-bold text-[10px] px-1.5 py-0.2 rounded-md border border-amber-500/20">
                                ${priceFormatted}
                            </span>
                        </div>

                        <!-- Pie de Foto: Logo Edición + CÓDIGO #NÚMERO (ej: LCI #258) -->
                        <div class="py-1 px-1 flex items-center justify-center gap-1.5 text-[11px] text-gray-400 group-hover:text-amber-400 transition">
                            <i class="ms ms-${card.set_code.toLowerCase()} ms-shadow"></i>
                            <span class="font-bold tracking-wider">${card.set_code.toUpperCase()} ${collectorNum}</span>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // Búsqueda traducida garantizada en español
        async function openCardModal(scryfallId, locationsJson) {
            const locations = JSON.parse(decodeURIComponent(locationsJson));
            const card = locations[0];
            const modal = document.getElementById('card-modal');

            document.getElementById('modal-card-img').src = `https://api.scryfall.com/cards/${scryfallId}?format=image`;
            document.getElementById('modal-card-title').textContent = card.name;
            document.getElementById('modal-set-info').textContent = `${card.set_name} (${card.set_code.toUpperCase()}) ${card.collector_number ? '#' + card.collector_number : ''}`;
            document.getElementById('modal-set-icon').className = `ms ms-${card.set_code.toLowerCase()} text-base`;
            document.getElementById('modal-card-price').textContent = card.purchase_price ? `${card.purchase_price} €` : 'N/A';

            const locContainer = document.getElementById('modal-card-locations');
            locContainer.innerHTML = locations.map(l => `
                <div class="flex justify-between items-center py-1 px-2.5 rounded-lg ${l.is_deck ? 'bg-amber-500/10 text-amber-300' : 'bg-emerald-500/10 text-emerald-300'} border border-white/5">
                    <span>${l.is_deck ? '⚔️ ' : '📦 '}${l.location}</span>
                    <span class="font-bold">${l.total_quantity}x</span>
                </div>
            `).join('');

            modal.classList.remove('hidden');

            const textContainer = document.getElementById('modal-card-text');
            const translatedNameElem = document.getElementById('modal-card-translated-name');
            textContainer.innerHTML = '<span class="text-amber-400">Obteniendo texto oficial en español...</span>';

            try {
                // Consultamos a Scryfall buscando exactamente la carta en idioma español (lang:es)
                const searchRes = await fetch(`https://api.scryfall.com/cards/search?q=!"${encodeURIComponent(card.name)}"+lang:es`);

                if (searchRes.ok) {
                    const searchData = await searchRes.json();
                    if (searchData.data && searchData.data.length > 0) {
                        const cardEs = searchData.data[0];
                        const nameEs = cardEs.printed_name || cardEs.name;
                        const textEs = cardEs.printed_text || cardEs.oracle_text || 'Sin texto de regla.';

                        translatedNameElem.textContent = `🇪🇸 ${nameEs}`;
                        textContainer.innerHTML = textEs.replace(/\n/g, '<br>');
                        return;
                    }
                }

                // Si no existe carta en idioma español, traemos el texto en inglés oficial
                const resEn = await fetch(`https://api.scryfall.com/cards/${scryfallId}`);
                const dataEn = await resEn.json();
                translatedNameElem.textContent = '';
                textContainer.innerHTML = (dataEn.oracle_text || 'Sin texto de regla.').replace(/\n/g, '<br>');

            } catch (e) {
                textContainer.textContent = 'No se pudo obtener el texto.';
            }
        }

        function closeCardModal() {
            document.getElementById('card-modal').classList.add('hidden');
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('upload-status');
            const formData = new FormData();

            formData.append('file', document.getElementById('csv-file').files[0]);
            formData.append('location', document.getElementById('location-input').value);
            formData.append('is_deck', document.getElementById('is-deck-checkbox').checked);

            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = '<span class="text-amber-400">Subiendo e importando registros...</span>';

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const result = await res.json();

                if (res.ok) {
                    statusDiv.innerHTML = `<span class="text-emerald-400">✅ ${result.message}</span>`;
                    loadStats();
                    triggerSearch();
                } else {
                    statusDiv.innerHTML = `<span class="text-rose-400">❌ Error: ${result.message}</span>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<span class="text-rose-400">❌ Error al subir archivo.</span>`;
            }
        });

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('stat-unique').textContent = data.unique_cards || 0;
                document.getElementById('stat-total').textContent = data.total_cards || 0;
                document.getElementById('stat-locations').textContent = data.total_locations || 0;
            } catch (e) { }
        }

        loadStats();
        triggerSearch();
    </script>
</body>

</html>
