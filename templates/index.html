<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Collection Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/mana-font@1.4.1/css/mana.min.css" rel="stylesheet" />
    <link href="/static/style.css" rel="stylesheet" />
</head>

<body class="min-h-screen">

    <!-- CABECERA -->
    <header class="app-header sticky top-0 z-40 px-6 py-2.5">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2.5">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center shadow-lg">
                        <i class="ms ms-planeswalker text-black font-bold text-lg"></i>
                    </div>
                    <span
                        class="text-base font-extrabold bg-gradient-to-r from-gray-100 to-amber-400 bg-clip-text text-transparent">MTGSuite</span>
                </div>
                <nav class="flex p-1 bg-zinc-900/90 rounded-xl border border-zinc-800/80 text-xs font-medium">
                    <button onclick="switchTab('view-collection')" id="nav-view-collection"
                        class="tab-btn px-3.5 py-1.5 rounded-lg flex items-center gap-2 text-amber-400 bg-zinc-800/90 shadow-sm transition">
                        <i data-lucide="layers" class="w-3.5 h-3.5"></i> Colección
                    </button>
                    <button onclick="switchTab('view-decks')" id="nav-view-decks"
                        class="tab-btn px-3.5 py-1.5 rounded-lg flex items-center gap-2 text-zinc-400 hover:text-zinc-200 transition">
                        <i data-lucide="swords" class="w-3.5 h-3.5"></i> Mazos
                    </button>
                    <button onclick="switchTab('view-import')" id="nav-view-import"
                        class="tab-btn px-3.5 py-1.5 rounded-lg flex items-center gap-2 text-zinc-400 hover:text-zinc-200 transition">
                        <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i> Importar CSV
                    </button>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="updatePricesNow()" id="btn-update-prices"
                    class="text-xs px-3 py-1.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 transition flex items-center gap-1.5 font-medium shadow-sm">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Sincronizar Cardmarket
                </button>
                <div
                    class="flex items-center text-xs bg-zinc-900/80 px-3 py-1.5 rounded-xl border border-zinc-800 text-zinc-400">
                    <div class="px-2 border-r border-zinc-800">Únicas: <span id="stat-unique"
                            class="font-semibold font-mono text-amber-400">0</span></div>
                    <div class="px-2 border-r border-zinc-800">Total: <span id="stat-total"
                            class="font-semibold font-mono text-amber-400">0</span></div>
                    <div class="px-2">Ubicaciones: <span id="stat-locations"
                            class="font-semibold font-mono text-amber-400">0</span></div>
                </div>
            </div>
        </div>
    </header>

    <!-- INYECCIÓN DE FRAGMENTOS -->
    <main class="max-w-7xl mx-auto px-4 py-5">
        <div id="view-collection" class="tab-content">
            {% include 'views/collection.html' %}
        </div>
        <div id="view-decks" class="tab-content hidden">
            {% include 'views/decks.html' %}
        </div>
        <div id="view-import" class="tab-content hidden">
            {% include 'views/import.html' %}
        </div>
    </main>

    <!-- MOTOR JAVASCRIPT GLOBAL -->
    <script>
        let activeRarities = [];
        let activeColors = [];
        let isCommanderMode = false;
        let cardCache = [];
        window.cardStore = {};
        window.deckCardStore = {};

        function renderIcons() {
            if (window.lucide) lucide.createIcons();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-amber-400', 'bg-zinc-800/90', 'shadow-sm');
                el.classList.add('text-zinc-400');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('text-amber-400', 'bg-zinc-800/90', 'shadow-sm');
            document.getElementById(`nav-${tabId}`).classList.remove('text-zinc-400');
            if (tabId === 'view-decks') loadDecks();
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('stat-unique').textContent = data.unique_cards || 0;
                document.getElementById('stat-total').textContent = data.total_cards || 0;
                document.getElementById('stat-locations').textContent = data.total_locations || 0;
            } catch (e) { }
        }

        async function updatePricesNow() {
            const btn = document.getElementById('btn-update-prices');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Sincronizando...';
            btn.disabled = true;
            renderIcons();
            try {
                await fetch('/api/update-prices', { method: 'POST' });
                alert("Sincronización iniciada.");
            } catch (e) { } finally {
                btn.innerHTML = '<i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Sincronizar Cardmarket';
                btn.disabled = false;
                renderIcons();
            }
        }

        function toggleFiltersDrawer() {
            const drawer = document.getElementById('filters-drawer');
            if (drawer) drawer.classList.toggle('hidden');
        }

        function toggleRarity(rarity) {
            const btn = document.getElementById(`rarity-${rarity}`);
            if (activeRarities.includes(rarity)) {
                activeRarities = activeRarities.filter(r => r !== rarity);
                if (btn) btn.classList.remove('bg-amber-500/20', 'border-amber-500');
            } else {
                activeRarities.push(rarity);
                if (btn) btn.classList.add('bg-amber-500/20', 'border-amber-500');
            }
            triggerSearch();
        }

        function toggleColor(color) {
            const btn = document.getElementById(`color-${color}`);
            if (activeColors.includes(color)) {
                activeColors = activeColors.filter(c => c !== color);
                if (btn) {
                    btn.classList.remove('border-amber-400', 'ring-2', 'ring-amber-400/50', 'opacity-100');
                    btn.classList.add('border-transparent', 'opacity-60');
                }
            } else {
                activeColors.push(color);
                if (btn) {
                    btn.classList.add('border-amber-400', 'ring-2', 'ring-amber-400/50', 'opacity-100');
                    btn.classList.remove('border-transparent', 'opacity-60');
                }
            }
            renderGrid();
        }

        function toggleCommanderMode() {
            isCommanderMode = !isCommanderMode;
            const btn = document.getElementById('commander-toggle');
            const dot = document.getElementById('commander-dot');
            if (isCommanderMode) {
                if (btn) btn.classList.add('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
                if (dot) dot.classList.add('bg-amber-400');
            } else {
                if (btn) btn.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-amber-400');
                if (dot) dot.classList.remove('bg-amber-400');
            }
            renderGrid();
        }

        function getScryfallImageUrl(id) {
            if (!id || id.length < 2) return 'https://cards.scryfall.io/back.png';
            return `https://cards.scryfall.io/normal/front/${id.charAt(0)}/${id.charAt(1)}/${id}.jpg`;
        }

        function formatManaAndText(text) {
            if (!text) return '';
            return text.replace(/\{([^}]+)\}/g, (match, symbol) => {
                const cleanSym = symbol.toLowerCase().replace('/', '');
                return `<i class="ms ms-${cleanSym} ms-cost ms-shadow"></i>`;
            });
        }

        // --- BÚSQUEDA COLECCIÓN PRINCIPAL ---
        async function triggerSearch() {
            const searchInput = document.getElementById('search-input');
            const sortSelect = document.getElementById('sort-select');
            const spinner = document.getElementById('loading-spinner');

            const q = searchInput ? searchInput.value.trim() : "";
            const sortBy = sortSelect ? sortSelect.value : "name_asc";

            if (spinner) spinner.classList.remove('hidden');

            let url = `/api/search?q=${encodeURIComponent(q)}&sort_by=${sortBy}`;
            if (activeRarities.length > 0) url += `&rarity=${activeRarities.join(',')}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                cardCache = data.results || [];
                renderGrid();
            } catch (e) {
                console.error("Error buscando cartas:", e);
            } finally {
                if (spinner) spinner.classList.add('hidden');
                renderIcons();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('results-grid');
            const noResults = document.getElementById('no-results');
            if (!grid) return;

            if (cardCache.length === 0) {
                grid.innerHTML = '';
                if (noResults) noResults.classList.remove('hidden');
                return;
            }

            let filteredCards = cardCache;

            if (activeColors.length > 0) {
                filteredCards = cardCache.filter(card => {
                    if (activeColors.includes('C') && activeColors.length === 1) {
                        return !card.mana_cost || (!card.mana_cost.includes('W') && !card.mana_cost.includes('U') && !card.mana_cost.includes('B') && !card.mana_cost.includes('R') && !card.mana_cost.includes('G'));
                    }
                    return activeColors.some(col => card.mana_cost && card.mana_cost.includes(col));
                });
            }

            if (filteredCards.length === 0) {
                grid.innerHTML = '';
                if (noResults) noResults.classList.remove('hidden');
                return;
            }

            if (noResults) noResults.classList.add('hidden');
            const grouped = {};
            filteredCards.forEach(item => {
                if (!grouped[item.name]) grouped[item.name] = [];
                grouped[item.name].push(item);
            });

            window.cardStore = {};
            let index = 0;
            let htmlContent = '';

            Object.keys(grouped).forEach(cardName => {
                const locations = grouped[cardName];
                const card = locations[0];
                const imageUrl = getScryfallImageUrl(card.scryfall_id);
                const priceFormatted = card.purchase_price ? `${card.purchase_price}€` : '-';
                const totalQty = locations.reduce((acc, l) => acc + (l.total_quantity || 1), 0);
                const collectorNum = card.collector_number ? `#${card.collector_number}` : '';

                const storeKey = `card_${index++}`;
                window.cardStore[storeKey] = { card, locations };

                htmlContent += `
                    <div onclick="openCardModalFromStore('${storeKey}')" class="mtg-card-item group cursor-pointer">
                        <div class="mtg-card-img-wrapper">
                            <img src="${imageUrl}" alt="" loading="lazy" class="mtg-card-img" onerror="this.onerror=null; this.src='https://cards.scryfall.io/back.png';">
                        </div>
                        <div class="py-1 px-1 flex items-center justify-between text-[11px] text-zinc-400 border-t border-white/5 mt-1 pt-1">
                            <span class="bg-zinc-900/90 text-white font-bold text-[10px] px-1.5 py-0.5 rounded border border-white/10 font-mono">${totalQty}x</span>
                            <span class="flex items-center gap-1 font-bold tracking-wider text-zinc-300 group-hover:text-amber-400 transition">
                                <i class="ms ms-${card.set_code.toLowerCase()} ms-shadow"></i> ${card.set_code.toUpperCase()} ${collectorNum}
                            </span>
                            <span class="bg-zinc-900/90 text-amber-400 font-bold text-[10px] px-1.5 py-0.5 rounded border border-amber-500/20 font-mono">${priceFormatted}</span>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = htmlContent;
            renderIcons();
        }

        // --- SISTEMA DE MAZOS Y VISTA DETALLADA ---
        async function loadDecks() {
            try {
                const pRes = await fetch('/api/decks/physical');
                const pData = await pRes.json();
                const pList = document.getElementById('physical-decks-list');
                if (pList) {
                    pList.innerHTML = pData.decks.map(d => `
                        <div onclick="openDeckView('physical', '${d.name}', '${d.name}')" class="panel-card p-4 flex justify-between items-center border-l-2 border-l-emerald-500 cursor-pointer hover:bg-zinc-800/80 transition">
                            <span class="font-bold text-zinc-200">${d.name}</span>
                            <span class="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-400">${d.total_cards} cartas</span>
                        </div>
                    `).join('');
                }

                const bRes = await fetch('/api/decks/brews');
                const bData = await bRes.json();
                const bList = document.getElementById('brewed-decks-list');
                if (bList) {
                    bList.innerHTML = bData.decks.map(d => `
                        <div onclick="openDeckView('brew', '${d.id}', '${d.name}')" class="panel-card p-4 flex justify-between items-center border-l-2 border-l-amber-500 cursor-pointer hover:bg-zinc-800/80 transition">
                            <span class="font-bold text-zinc-200">${d.name}</span>
                            <span class="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-400">${d.total_cards} cartas</span>
                        </div>
                    `).join('');
                }
            } catch (e) { }
        }

        function closeDeckView() {
            document.getElementById('deck-detail-view').classList.add('hidden');
            document.getElementById('decks-overview').classList.remove('hidden');
        }

        async function openDeckView(type, identifier, deckName) {
            document.getElementById('decks-overview').classList.add('hidden');
            document.getElementById('deck-detail-view').classList.remove('hidden');
            document.getElementById('deck-detail-title').textContent = deckName;
            document.getElementById('deck-detail-content').innerHTML = '<div class="text-amber-400 flex items-center gap-2 py-10"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Analizando el mazo...</div>';
            renderIcons();

            try {
                const url = type === 'physical' ? `/api/decks/physical/${encodeURIComponent(identifier)}` : `/api/decks/brews/${identifier}`;
                const res = await fetch(url);
                const data = await res.json();
                const cards = data.cards;

                // Obtener datos extra de Scryfall para poder separarlos por tipo
                const uniqueIds = [...new Set(cards.map(c => c.scryfall_id))].filter(Boolean);
                const chunks = [];
                for (let i = 0; i < uniqueIds.length; i += 75) chunks.push(uniqueIds.slice(i, i + 75));

                const scryfallData = {};
                for (const chunk of chunks) {
                    const sRes = await fetch('https://api.scryfall.com/cards/collection', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifiers: chunk.map(id => ({ id })) })
                    });
                    if (sRes.ok) {
                        const sData = await sRes.json();
                        sData.data.forEach(c => { scryfallData[c.id] = c; });
                    }
                }

                let totalPrice = 0;
                let totalCards = 0;

                const categories = {
                    'Comandante / Leyendas': [],
                    'Planeswalkers': [],
                    'Criaturas': [],
                    'Conjuros': [],
                    'Instantáneos': [],
                    'Artefactos': [],
                    'Encantamientos': [],
                    'Tierras': [],
                    'Otros': []
                };

                window.deckCardStore = {};

                cards.forEach((card, idx) => {
                    const sCard = scryfallData[card.scryfall_id] || {};
                    const typeLine = (sCard.type_line || '').toLowerCase();
                    const price = card.purchase_price || parseFloat(sCard.prices?.eur || 0);

                    totalPrice += price * card.total_quantity;
                    totalCards += card.total_quantity;

                    card.imageUrl = sCard.image_uris?.normal || getScryfallImageUrl(card.scryfall_id);
                    card.priceFormatted = price ? `${price.toFixed(2)}€` : '-';

                    const storeKey = `deck_card_${idx}`;
                    window.deckCardStore[storeKey] = { card: card, locations: [{ location: deckName, total_quantity: card.total_quantity, is_deck: true }] };

                    if (typeLine.includes('legendary creature')) categories['Comandante / Leyendas'].push({ key: storeKey, ...card });
                    else if (typeLine.includes('creature')) categories['Criaturas'].push({ key: storeKey, ...card });
                    else if (typeLine.includes('planeswalker')) categories['Planeswalkers'].push({ key: storeKey, ...card });
                    else if (typeLine.includes('land')) categories['Tierras'].push({ key: storeKey, ...card });
                    else if (typeLine.includes('instant')) categories['Instantáneos'].push({ key: storeKey, ...card });
                    else if (typeLine.includes('sorcery')) categories['Conjuros'].push({ key: storeKey, ...card });
                    else if (typeLine.includes('artifact')) categories['Artefactos'].push({ key: storeKey, ...card });
                    else if (typeLine.includes('enchantment')) categories['Encantamientos'].push({ key: storeKey, ...card });
                    else categories['Otros'].push({ key: storeKey, ...card });
                });

                document.getElementById('deck-detail-count').textContent = `${totalCards} cartas`;
                document.getElementById('deck-total-price').textContent = `${totalPrice.toFixed(2)} €`;

                if (cards.length > 0) document.getElementById('deck-preview-img').src = cards[0].imageUrl;

                let htmlContent = '';
                Object.keys(categories).forEach(cat => {
                    if (categories[cat].length === 0) return;

                    categories[cat].sort((a, b) => a.name.localeCompare(b.name));
                    const count = categories[cat].reduce((acc, c) => acc + c.total_quantity, 0);

                    htmlContent += `
                        <div class="mb-6 break-inside-avoid">
                            <h4 class="text-[11px] font-bold text-amber-500 uppercase tracking-wider mb-2 border-b border-zinc-800/50 pb-1">${cat} (${count})</h4>
                            <ul class="space-y-1">
                                ${categories[cat].map(c => `
                                    <li onmouseover="document.getElementById('deck-preview-img').src='${c.imageUrl}'" 
                                        onclick="openDeckCardModal('${c.key}', '${c.scryfall_id}')"
                                        class="flex items-center gap-2 group cursor-pointer text-[12px] hover:bg-zinc-800/50 p-1 rounded transition">
                                        <span class="text-zinc-500 font-mono text-[10px] bg-zinc-900 px-1 rounded">${c.total_quantity}</span>
                                        <span class="text-zinc-300 group-hover:text-amber-400 transition truncate flex-1">${c.name}</span>
                                        <span class="text-zinc-600 group-hover:text-amber-500/80 text-[10px] transition">${c.priceFormatted}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                });

                document.getElementById('deck-detail-content').innerHTML = htmlContent;

            } catch (e) {
                console.error(e);
                document.getElementById('deck-detail-content').innerHTML = '<div class="text-rose-400">Error al cargar el mazo.</div>';
            }
        }

        // --- VENTANA MODAL (Sirve para Colección y Mazos) ---
        function openCardModalFromStore(storeKey) {
            const data = window.cardStore[storeKey];
            if (data) openCardModal(data.card.scryfall_id, data.card, data.locations);
        }

        function openDeckCardModal(storeKey, scryfallId) {
            const data = window.deckCardStore[storeKey];
            if (data) openCardModal(scryfallId, data.card, data.locations);
        }

        async function openCardModal(scryfallId, card, locations) {
            const modal = document.getElementById('card-modal');
            if (!modal) return;
            const imgUrl = getScryfallImageUrl(scryfallId);

            document.getElementById('modal-card-img').src = imgUrl;
            document.getElementById('modal-bg-blur').style.backgroundImage = `url('${imgUrl}')`;
            document.getElementById('modal-card-title').textContent = card.name;
            document.getElementById('modal-set-info').textContent = `${card.set_name} (${card.set_code.toUpperCase()}) ${card.collector_number ? '#' + card.collector_number : ''}`;
            document.getElementById('modal-set-icon').className = `ms ms-${card.set_code.toLowerCase()} text-[18px]`;
            document.getElementById('modal-card-price').textContent = card.purchase_price ? `${card.purchase_price} €` : 'N/A';

            const rarityElem = document.getElementById('modal-card-rarity');
            const r = (card.rarity || 'common').toLowerCase();
            const rNames = { common: 'Común', uncommon: 'Infrecuente', rare: 'Rara', mythic: 'Mítica' };
            if (rarityElem) {
                rarityElem.className = `badge-pill badge-${r}`;
                rarityElem.textContent = rNames[r] || 'Común';
            }

            document.getElementById('modal-card-locations').innerHTML = locations.map(l => `
                <div class="flex justify-between items-center py-1.5 px-3 rounded-xl ${l.is_deck ? 'bg-amber-500/10 text-amber-300 border-amber-500/20' : 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20'} border backdrop-blur-md">
                    <span class="font-medium flex items-center gap-2"><i data-lucide="${l.is_deck ? 'swords' : 'box'}" class="w-3.5 h-3.5"></i> ${l.location}</span>
                    <span class="font-bold bg-black/40 px-2 py-0.5 rounded-md font-mono">${l.total_quantity}x</span>
                </div>
            `).join('');

            modal.classList.remove('hidden');
            renderIcons();

            const textContainer = document.getElementById('modal-card-text');
            const translatedNameElem = document.getElementById('modal-card-translated-name');
            const typeElem = document.getElementById('modal-card-type');
            const manaElem = document.getElementById('modal-mana-cost');

            if (textContainer) textContainer.innerHTML = '<span class="text-amber-400 animate-pulse">Obteniendo texto oficial en español...</span>';
            if (translatedNameElem) translatedNameElem.textContent = '';

            try {
                const resEn = await fetch(`https://api.scryfall.com/cards/${scryfallId}`);
                const dataEn = await resEn.json();

                if (typeElem) typeElem.textContent = dataEn.type_line || 'Carta de Magic';
                if (manaElem) manaElem.innerHTML = formatManaAndText(dataEn.mana_cost || '');

                let textEs = null;
                let nameEs = null;

                if (dataEn.oracle_id) {
                    const searchRes = await fetch(`https://api.scryfall.com/cards/search?q=oracle_id:${dataEn.oracle_id}+lang:es`);
                    if (searchRes.ok) {
                        const searchData = await searchRes.json();
                        if (searchData.data && searchData.data.length > 0) {
                            const cardEs = searchData.data[0];
                            nameEs = cardEs.printed_name || cardEs.name;
                            textEs = cardEs.printed_text || cardEs.oracle_text;
                        }
                    }
                }

                if (textEs && translatedNameElem && textContainer) {
                    translatedNameElem.textContent = `🇪🇸 ${nameEs}`;
                    textContainer.innerHTML = formatManaAndText(textEs).replace(/\n/g, '<br>');
                } else if (textContainer) {
                    textContainer.innerHTML = formatManaAndText(dataEn.oracle_text || 'Sin texto de regla.').replace(/\n/g, '<br>');
                }
            } catch (e) {
                if (textContainer) textContainer.textContent = 'Sin texto disponible.';
            }
        }

        function closeCardModal() {
            const modal = document.getElementById('card-modal');
            if (modal) modal.classList.add('hidden');
        }

        // --- GESTIÓN DE FORMULARIOS ---
        const importForm = document.getElementById('import-text-form');
        if (importForm) {
            importForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-submit-brew');
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Procesando...';
                renderIcons();

                await fetch('/api/decks/import-text', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('brew-name').value,
                        decklist: document.getElementById('brew-list').value
                    })
                });

                document.getElementById('import-text-form').reset();
                document.getElementById('import-text-modal').classList.add('hidden');
                btn.innerHTML = '<i data-lucide="download" class="w-4 h-4"></i> Importar desde Scryfall';
                loadDecks();
                renderIcons();
            });
        }

        const uploadForm = document.getElementById('upload-form');
        if (uploadForm) {
            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const statusDiv = document.getElementById('upload-status');
                const btn = document.getElementById('btn-upload');
                const formData = new FormData();

                formData.append('file', document.getElementById('csv-file').files[0]);
                formData.append('location', document.getElementById('location-input').value);
                formData.append('is_deck', document.getElementById('is-deck-checkbox').checked);

                statusDiv.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'bg-rose-500/10', 'text-rose-400');
                statusDiv.classList.add('bg-amber-500/10', 'text-amber-400');
                statusDiv.innerHTML = '<div class="flex items-center justify-center gap-2"><i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Importando...</div>';
                btn.disabled = true;
                renderIcons();

                try {
                    const res = await fetch('/api/upload', { method: 'POST', body: formData });
                    const result = await res.json();
                    statusDiv.classList.remove('bg-amber-500/10', 'text-amber-400');
                    if (res.ok) {
                        statusDiv.classList.add('bg-emerald-500/10', 'text-emerald-400');
                        statusDiv.innerHTML = `<div class="flex items-center justify-center gap-2"><i data-lucide="check-circle-2" class="w-4 h-4"></i> ${result.message}</div>`;
                        loadStats();
                        triggerSearch();
                        document.getElementById('upload-form').reset();
                    } else {
                        statusDiv.classList.add('bg-rose-500/10', 'text-rose-400');
                        statusDiv.innerHTML = `<div class="flex items-center justify-center gap-2"><i data-lucide="alert-circle" class="w-4 h-4"></i> Error: ${result.message}</div>`;
                    }
                } catch (err) {
                    statusDiv.classList.remove('bg-amber-500/10', 'text-amber-400');
                    statusDiv.classList.add('bg-rose-500/10', 'text-rose-400');
                    statusDiv.innerHTML = `<div class="flex items-center justify-center gap-2"><i data-lucide="alert-circle" class="w-4 h-4"></i> Error de conexión.</div>`;
                } finally {
                    btn.disabled = false;
                    renderIcons();
                }
            });
        }

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            triggerSearch();
            renderIcons();

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                let typingTimer;
                searchInput.addEventListener('input', () => {
                    clearTimeout(typingTimer);
                    typingTimer = setTimeout(() => {
                        triggerSearch();
                    }, 300);
                });
            }
        });
    </script>
</body>

</html>
