<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Collection Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/mana-font@1.4.1/css/mana.min.css" rel="stylesheet" />
    <link href="/static/style.css" rel="stylesheet" />
</head>

<body class="min-h-screen">

    <header class="app-header sticky top-0 z-40 px-6 py-2.5">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-2.5">
                    <div
                        class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center shadow-lg">
                        <i class="ms ms-planeswalker text-black font-bold text-lg"></i>
                    </div>
                    <span
                        class="text-base font-extrabold bg-gradient-to-r from-gray-100 to-amber-400 bg-clip-text text-transparent">MTGSuite</span>
                </div>

                <nav class="flex p-1 bg-zinc-900/90 rounded-xl border border-zinc-800/80 text-xs font-medium">
                    <button onclick="switchTab('view-collection')" id="nav-view-collection"
                        class="tab-btn px-3.5 py-1.5 rounded-lg flex items-center gap-2 text-amber-400 bg-zinc-800/90 shadow-sm transition">
                        <i data-lucide="layers" class="w-3.5 h-3.5"></i> Colección
                    </button>
                    <button onclick="switchTab('view-decks')" id="nav-view-decks"
                        class="tab-btn px-3.5 py-1.5 rounded-lg flex items-center gap-2 text-zinc-400 hover:text-zinc-200 transition">
                        <i data-lucide="swords" class="w-3.5 h-3.5"></i> Mazos
                    </button>
                    <button onclick="switchTab('view-import')" id="nav-view-import"
                        class="tab-btn px-3.5 py-1.5 rounded-lg flex items-center gap-2 text-zinc-400 hover:text-zinc-200 transition">
                        <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i> Importar CSV
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-5">
        <!-- Inyección de Componentes Modulares -->
        <div id="view-collection" class="tab-content">
            {% include 'views/collection.html' %}
        </div>

        <div id="view-decks" class="tab-content hidden">
            {% include 'views/decks.html' %}
        </div>

        <div id="view-import" class="tab-content hidden">
            {% include 'views/import.html' %}
        </div>
    </main>

    <script>
        function renderIcons() { if (window.lucide) lucide.createIcons(); }
        renderIcons();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('text-amber-400', 'bg-zinc-800/90', 'shadow-sm');
                el.classList.add('text-zinc-400');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).classList.add('text-amber-400', 'bg-zinc-800/90', 'shadow-sm');
            document.getElementById(`nav-${tabId}`).classList.remove('text-zinc-400');
        }
    </script>
</body>

</html>
